name: Deploy to QA

on:
  push:
    branches: [ develop ]

jobs:
  backend-test:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate --schema=prisma/schema.prisma

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_qa
        run: |
          cd backend
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Install Newman
        run: npm install -g newman

      - name: Start backend and run Newman tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_qa
          JWT_SECRET: qa-test-secret
          PORT: 3001
          NODE_ENV: test
        run: |
          cd backend
          npm start > "$RUNNER_TEMP/qa-backend.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/api/rooms >/dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent http://localhost:3001/api/rooms >/dev/null; then
            cat "$RUNNER_TEMP/qa-backend.log"
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi

          cd ..
          newman run tests/booking-api.postman_collection.json \
            --env-var "baseUrl=http://localhost:3001" \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml

          kill "$server_pid" 2>/dev/null || true

      - name: Upload Newman test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-newman-test-results
          path: newman-results.xml
          if-no-files-found: ignore

  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: backend-test
    environment: qa

    steps:
      - name: Trigger Vercel QA deployment
        env:
          VERCEL_DEPLOY_HOOK_QA: ${{ secrets.VERCEL_DEPLOY_HOOK_QA }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_QA" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK_QA secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST "$VERCEL_DEPLOY_HOOK_QA"

      - name: Trigger Render QA deployment
        env:
          RENDER_DEPLOY_HOOK_QA: ${{ secrets.RENDER_DEPLOY_HOOK_QA }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_QA" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_QA secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_QA"

      - name: Wait for Render QA backend health check
        env:
          RENDER_BACKEND_URL_QA: ${{ secrets.RENDER_BACKEND_URL_QA }}
        run: |
          if [ -z "$RENDER_BACKEND_URL_QA" ]; then
            echo "Missing RENDER_BACKEND_URL_QA secret." >&2
            exit 1
          fi
          timeout=300
          interval=10
          elapsed=0
          while [ "$elapsed" -lt "$timeout" ]; do
            if curl --fail --silent --connect-timeout 5 --max-time 10 \
              "$RENDER_BACKEND_URL_QA/api/rooms" >/dev/null; then
              echo "Render QA deployment is healthy."
              exit 0
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done
          echo "Render QA health check failed after ${timeout}s." >&2
          exit 1
